<style>

body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
header{background:#1e5a96;color:#fff;padding:10px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:14px}

h2{margin:0 0 10px;font-size:20px;color:var(--pri)}h3{margin:14px 0 6px;font-size:15px}

input{font:inherit;padding:7px;border:1px solid var(--bd);border-radius:4px;background:var(--card);color:var(--tx)}
.ok{color:var(--ok);font-weight:600}.bad{color:var(--bad);font-weight:600}.warn{color:var(--warn);font-weight:600}
.bar{height:8px;background:var(--bd);border-radius:4px;overflow:hidden;min-width:70px}.bar i{display:block;height:100%;background:var(--ok)}

/* ===== NEW UI ===== */
:root:root:root:root{--bg:#0A0E13;--card:#10161D;--tx:#E8EDF2;--mut:#8FA0B3;--pri:#B6F24A;--bd:#1F2B38;--ok:#6EE08F;--bad:#FF7A7A;--warn:#FFC15A;--code:#0B1016;--ac:#B6F24A;--f1:"DM Sans",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;--fd:"Bricolage Grotesque","DM Sans",system-ui,sans-serif;--fm:"JetBrains Mono",ui-monospace,Consolas,monospace}
body{background:#0A0E13!important;font-family:var(--f1);font-size:16px}
h1,h2,.sec-t,.pf-n,.al h1{font-family:var(--fd);letter-spacing:-.4px}
h2{color:var(--tx)}
header{background:#0A0E13;border-bottom:1px solid #1C2631;padding:14px 24px;gap:16px 28px;font-size:15px}
.logo img{height:34px}
nav{gap:6px}nav a{font-size:15px;padding:8px 14px;border-radius:9px;color:#9CAABB}
nav a.on{background:#161E28;color:var(--tx);font-weight:600}nav a:hover{background:#121A23;color:var(--ac)}nav a.on:hover{color:var(--tx)}
.user .pl{padding:4px 14px 4px 4px;border-radius:99px;border:1px solid #243040;font-weight:600;font-size:14px}
.user .pl .av{border:2px solid var(--ac)}
main{max-width:1200px;margin:28px auto;padding:0 24px}main.wide{max-width:none;margin:0;padding:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:24px}
button{background:var(--ac);color:#0A0E13;font-weight:700;font-size:14px;border-radius:10px;padding:10px 20px;min-height:38px;transition:filter .15s}
button:hover{filter:brightness(1.08)}
button.sec{background:transparent;color:var(--tx);border:1px solid #2B3A4C;font-weight:600;padding:6px 14px}button.sec:hover{border-color:var(--ac);color:var(--ac)}
input,.sel,select{background:#10161D;border:1px solid #243040;border-radius:10px;padding:9px 12px;color:var(--tx)}
input:focus,textarea:focus,select:focus{outline:2px solid rgba(182,242,74,.45);outline-offset:0}
textarea{border-radius:10px;border-color:#243040}
table{border-collapse:separate;border-spacing:0}
th{background:#0D1319;color:#7E8FA3;font-size:12px;padding:12px 14px}th:first-child{border-radius:12px 0 0 0}th:last-child{border-radius:0 12px 0 0}
td{padding:14px;border-bottom:1px solid #1B2530}
tr.row:hover td{background:#131B24}
pre{border-radius:10px;background:var(--code)}
.sid{color:var(--ac)}.sw a{color:var(--ac)}
.lst{border-radius:18px;padding:6px 24px}
.pi{padding:16px 0}.pi:hover .pt{color:var(--ac)}
.pt{font-size:16px}
.ck{border-color:#2B3A4C}.ck.ok{border-color:var(--ac);background:var(--ac);color:#0A0E13}
.d-Easy{color:#6EE08F}.d-Medium{color:#FFC15A}.d-Hard{color:#FF8A8A}
.tests span{border-radius:7px;font-family:var(--fm);font-weight:600}
.tests .p{background:var(--ac);color:#0A0E13}.tests .f{background:#FF7A7A;color:#0A0E13}
.pn{border-radius:18px;background:var(--card)}
.tabs{padding:10px 12px;gap:6px}.tabs a{font-size:14px;padding:7px 14px;border-radius:9px}.tabs a.on{background:#1E2A38;color:var(--tx);font-weight:600}
.mt span{padding:3px 10px;border:1px solid #243040;border-radius:99px;font-family:var(--fm);font-size:12px}
.exb{border:1px solid var(--bd);background:var(--code);border-radius:12px}
.badge{background:#15281B;color:#6EE08F;border-radius:99px;padding:3px 12px;font-weight:600}
.hlc,.cw textarea,.ln,.ed textarea{font-family:var(--fm)}
.cw textarea::selection{background:rgba(182,242,74,.25)}
.ac{background:#141C26;border-radius:10px}.ac div.on{background:#1E2A38}
.ac i{color:var(--ac)}
.hh{display:flex;flex-wrap:wrap;gap:24px;align-items:center;padding:36px 0 12px}
.hh>div{flex:1 1 520px;min-width:0}
.chip{display:inline-flex;align-items:center;gap:8px;font:600 13px var(--fm);color:var(--ac);border:1px solid #2A3B2A;background:#111C14;border-radius:99px;padding:5px 12px;margin-bottom:20px}
.chip:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ac)}
.hh h1{font-family:var(--fd);font-weight:800;font-size:64px;line-height:1.02;letter-spacing:-2px;margin:0 0 18px}
.hh p{color:#A3B1C2;font-size:18px;max-width:560px;margin:0 0 28px}
.hh button{font-size:16px;padding:0 24px;min-height:48px;border-radius:12px;margin-right:10px}
@media(max-width:700px){.hh h1{font-size:42px}}
.hero{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:24px;margin-top:18px}
.hero h1{font-family:var(--fd);font-size:28px}
.hi{background:#16212B;border-radius:14px}
.cd{border-radius:14px;background:#0B1016}.cdh{background:#15281B;color:var(--ac);border-radius:13px 13px 0 0}
.cdd,.cdt b{font-family:var(--fm)}
.note{background:#131C14;border:1px solid #2A3B2A;color:#D8E8CF;border-radius:14px;padding:16px 20px}
.sec-t{font-size:26px;margin:40px 0 4px}
.nc,.rc,.mc{border-radius:16px;background:var(--card)}
.rc .dt{color:var(--ac)}
.sb{border-radius:12px}
.big{background:var(--ac)}
.pf-ring{border-color:var(--ac)}
.pf-tabs a.on,.pf-seg a.on{background:#1E2A38}
footer{border-top:1px solid #1C2631;padding:28px}
.feed{display:flex;flex-direction:column;gap:10px}
.fd{position:relative;display:flex;gap:16px;align-items:center;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px 18px}
.fd .av{width:48px!important;height:48px!important;line-height:48px!important}
.fb{position:absolute;left:46px;top:44px;width:22px;height:22px;border-radius:50%;border:2px solid var(--card);display:flex;align-items:center;justify-content:center}
.fd b{color:var(--tx)}.fd>div{color:var(--mut)}.fd .fl{cursor:pointer;color:var(--tx)}.fd .fl:hover{color:var(--ac)}
#st{margin-bottom:16px}
::selection{background:rgba(182,242,74,.3)}
</style>
</head>

function avatar(n,sz){const p=(S.get("prof",{})[String(n).toLowerCase()]||{});
 if(p.avatar)return `<img class="av" src="${esc(p.avatar)}" style="width:${sz}px;height:${sz}px">`;
 let h=0;for(const c of String(n))h=(h*31+c.charCodeAt(0))%360;
 return `<span class="av" style="width:${sz}px;height:${sz}px;line-height:${sz}px;font-size:${Math.round(sz*.5)}px;background:hsl(${h},60%,62%)">${esc(String(n)[0]||"?").toUpperCase()}</span>`}
function countries(){const dn=new Intl.DisplayNames(["en"],{type:"region"}),out=[],A="ABCDEFGHIJKLMNOPQRSTUVWXYZ";
 for(const a of A)for(const b of A){const c=a+b;try{const n=dn.of(c);if(n&&n!==c&&n!=="Unknown Region")out.push([c,n])}catch(e){}}
 return out.sort((x,y)=>x[1].localeCompare(y[1]))}
function readAvatar(file){return new Promise((ok,no)=>{const r=new FileReader();r.onerror=()=>no();
 r.onload=()=>{const im=new Image();im.onerror=()=>no();im.onload=()=>{const c=document.createElement("canvas");c.width=c.height=128;const sq=Math.min(im.width,im.height);
  c.getContext("2d").drawImage(im,(im.width-sq)/2,(im.height-sq)/2,sq,sq,0,0,128,128);ok(c.toDataURL("image/jpeg",.85))};im.src=r.result};r.readAsDataURL(file)})}

  if(!cur.sp&&w==="include"&&/#\s*$/.test(ta.value.slice(0,ta.selectionStart-pre.length)))w=getLang()==="c"?"include <stdio.h>":"include <iostream>";
  const p=ta.selectionStart;
  if(cur.end&&ta.value[p]!==cur.end)w+=cur.end;
  ta.setRangeText(w,p-pre.length,p,"end");hide();changed();
 };
 const ins=(t,back)=>{ta.setRangeText(t,ta.selectionStart,ta.selectionEnd,"end");if(back)ta.selectionStart=ta.selectionEnd=ta.selectionEnd-back};
 ac.onmousedown=e=>{const d=e.target.closest("[data-i]");if(d){e.preventDefault();sel=+d.dataset.i;accept()}};
 ta.addEventListener("input",()=>{changed();show()});
 ta.addEventListener("scroll",()=>{sync();hide()});
 ta.addEventListener("blur",()=>setTimeout(hide,150));
 ta.addEventListener("click",hide);
 ta.addEventListener("keydown",e=>{
  const k=e.key;
  if(ac.style.display==="block"){
   if(k==="Tab"){e.preventDefault();accept();return}
   if(k==="ArrowDown"||k==="ArrowUp"){e.preventDefault();sel=(sel+(k==="ArrowDown"?1:items.length-1))%items.length;draw();return}
   if(k==="Escape"){hide();return}
  }
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  const v=ta.value,p=ta.selectionStart,q=ta.selectionEnd;
  if(k==="Tab"){e.preventDefault();ins("  ");changed();return}
  if(k==="Enter"){
   const ls=v.lastIndexOf("\n",p-1)+1,ind=/^\s*/.exec(v.slice(ls,p))[0],pc=v[p-1],nc=v[p];
   e.preventDefault();
   if(pc==="{"&&nc==="}")ins("\n"+ind+"  \n"+ind,ind.length+1);
   else ins("\n"+ind+((pc==="{"||(getLang()==="py"&&pc===":"))?"  ":""));
   hide();changed();return}
  if(k.length!==1)return;
  const pairs={"(":")","[":"]","{":"}",'"':'"',"'":"'"};
  if(p===q&&")]}\"'".includes(k)&&v[p]===k){e.preventDefault();ta.selectionStart=ta.selectionEnd=p+1;return}
  if(p===q&&pairs[k]){
   if((k==='"'||k==="'")&&/\w/.test(v[p-1]||""))return;
   e.preventDefault();ins(k+pairs[k],1);changed();hide()}
 });
 return{refresh};
}

 const att=()=>{const m=subs.filter(s=>s.user===me&&s.pid===id);$("#lp").innerHTML="<h3>Attempts</h3>"+(m.map(s=>`<p><a class="sid" data-sid="${s.id}">#${s.id}</a> <span class="${s.verdict==="Accepted"?"ok":"bad"}">${s.verdict}</span> · ${s.score}% · ${LANGS[s.lang||"js"]} <span class="meta">${new Date(s.n).toLocaleString()}</span></p>`).join("")||'<p class="meta">No attempts yet.</p>');$("#lp").querySelectorAll(".sid").forEach(a=>a.onclick=()=>go("sub",a.dataset.sid))};

function verdictHtml(r){const c=r.verdict==="Accepted"?"ok":r.verdict==="Wrong Answer"?"bad":"warn";
  return `<p><span class="${c}">${r.verdict}</span> — passed ${r.res.filter(x=>x==="OK").length} of ${r.res.length} tests (${r.score}%)</p>`}
const WSRC=`onmessage=e=>{const L=e.data.input.split("\\n");let i=0;const o=[];
const readline=()=>i<L.length?L[i++]:"",print=(...a)=>o.push(a.join(" "));
try{new Function("readline","print",e.data.code)(readline,print);postMessage({out:o.join("\\n")})}catch(x){postMessage({err:String(x)})}}`;
function runOne(code,input,tl){tl=tl||2;
  return new Promise(res=>{
    let w;
    const direct=()=>{const L=input.split("\n");let i=0;const o=[];
      try{new Function("readline","print",code)(()=>i<L.length?L[i++]:"",(...a)=>o.push(a.join(" ")));res({out:o.join("\n")})}catch(x){res({err:String(x)})}};
    try{w=new Worker(URL.createObjectURL(new Blob([WSRC],{type:"text/javascript"})))}catch(e){return direct()}
    const t=setTimeout(()=>{w.terminate();res({tle:1})},tl*1000);
    w.onmessage=e=>{clearTimeout(t);w.terminate();res(e.data)};
    w.onerror=()=>{clearTimeout(t);w.terminate();direct()};
    w.postMessage({code,input});
  });
}
const CONC=lang=>{const h=navigator.hardwareConcurrency||2;return lang==="js"?Math.min(6,h):Math.max(1,Math.min(3,h))};
function warm(lang){const J=S.get("judge",null);if(lang==="js"||(J&&J.url))return;
 const k=lang==="py"?"py":"cpp",src=lang==="py"?PYSRC:CPPSRC;for(let i=0;i<CONC(lang);i++)getW(k+i,src)}
async function judge(p,code,lang,prog){
  const tl=p.tl||2,ml=p.ml||128,n=p.ins.length,res=new Array(n),J=S.get("judge",null),srv=!!(J&&J.url&&lang!=="js");
  let msg="",ms=0,mem=0,next=0,done=0;
  const lane=async slot=>{let first=true;
   while(next<n){const k=next++,inp=p.ins[k],t0=performance.now();
    const r=await runAny(lang,code,inp,slot,tl,ml);if(r.mem)mem=Math.max(mem,r.mem);
    if(!first||lang==="js"||srv)ms=Math.max(ms,Math.round(performance.now()-t0));first=false;
    if(r.err&&!msg)msg=/unsafe-eval|Content Security Policy/i.test(r.err)?"This page blocks running code (the claude.ai preview does this). Open the site from your GitHub Pages link or download index.html and open it in your browser.":r.err;
    let v="OK";
    if(r.tle)v="TLE";else if(r.mle||(r.mem&&r.mem>ml))v="MLE";else if(r.err)v="RE";else if(r.out.trim().replace(/\s+\n/g,"\n")!==p.ref(inp))v="WA";
    res[k]=v;done++;if(prog)prog(done,n)}};
  await Promise.all(Array.from({length:Math.min(n,CONC(lang))},(_,i)=>lane(i)));
  let verdict="Accepted";
  const ok=res.filter(x=>x==="OK").length,score=Math.round(ok/res.length*100);
  if(ok<res.length){const f=res.find(x=>x!=="OK");verdict=f==="TLE"?"Time Limit Exceeded":f==="MLE"?"Memory Limit Exceeded":f==="RE"?"Runtime Error":"Wrong Answer"}
  return{verdict,score,res,msg,ms,mem};
}

function rating(){
  const us={};subs.forEach(s=>{us[s.user]=us[s.user]||{};us[s.user][s.pid]=Math.max(us[s.user][s.pid]||0,s.score)});
  const rows=Object.entries(us).map(([u,m])=>({u,solved:Object.values(m).filter(x=>x===100).length,pts:Object.values(m).reduce((a,b)=>a+b,0)}))
   .sort((a,b)=>b.solved-a.solved||b.pts-a.pts);
  app.innerHTML=`<div class="card"><h2>Rating</h2><div class="wrap"><table><tr><th>#</th><th>User</th><th>Solved</th><th>Points</th>${isAdmin()?"<th></th>":""}</tr>${
  rows.map((r,i)=>`<tr><td>${i+1}</td><td><a class="sid ul" data-u="${esc(r.u)}">${esc(r.u)}</a></td><td>${r.solved}/${P.length}</td><td>${r.pts}</td>${isAdmin()?`<td><button class="sec rd" data-u="${esc(r.u)}">Delete</button></td>`:""}</tr>`).join("")||'<tr><td colspan="5" class="meta">Nobody yet.</td></tr>'}</table></div>
  <p class="meta">Ranks users on this device. A shared server-side rating is the next step.</p></div>`;

  app.querySelectorAll(".rd").forEach(b=>b.onclick=()=>{
   if(!isAdmin())return;
   if(!b.dataset.sure){b.dataset.sure=1;b.textContent="Click again to confirm";b.style.color="var(--bad)";setTimeout(()=>{if(b.isConnected){delete b.dataset.sure;b.textContent="Delete";b.style.color=""}},3000);return}

   rating()});
}
