function getW(kind,src){
 if(WK[kind])return WK[kind];
 let w;try{w=new Worker(URL.createObjectURL(new Blob([src],{type:"text/javascript"})))}catch(e){return null}
 const o={w,ready:false};
 o.rp=new Promise(res=>{w.onmessage=m=>{if(m.data.ready){o.ready=true;res(true)}};w.onerror=()=>res(false)});
 WK[kind]=o;return o;
}
async function runWorker(kind,src,code,input){
 const o=getW(kind,src);
 if(!o)return{err:"Web workers are not available here"};
 if(!o.ready){const ok=await Promise.race([o.rp,new Promise(r=>setTimeout(()=>r(false),60000))]);
  if(!ok){o.w.terminate();delete WK[kind];return{err:"Could not load the runtime. Check your internet connection."}}}
 return new Promise(res=>{
  const t=setTimeout(()=>{o.w.terminate();delete WK[kind];res({tle:1})},3000);

  o.w.postMessage({code,input});
 });
}

 app.innerHTML=`<h2 class="sec-t" style="margin:6px 0 14px">Problems</h2><div class="tb"><input id="q" placeholder="Search"><select id="df" class="sel"><option value="">All levels</option><option>Easy</option><option>Medium</option></select></div><div class="lst" id="lst"></div>`;
 const draw=()=>{const q=$("#q").value.toLowerCase(),f=$("#df").value;
  $("#lst").innerHTML=P.filter(p=>(!f||p.lvl===f)&&(!q||(p.t+" "+TAGS[p.id].join(" ")+" #"+p.id).toLowerCase().includes(q))).map(p=>{const b=best(p.id);
   return `<div class="pi" data-id="${p.id}"><span class="ck ${b===100?"ok":b>0?"part":""}">${b===100?"✓":""}</span><div><div class="pt">${p.t}<i>#${p.id}</i></div><div class="ps"><span class="d-${p.lvl}">${p.lvl}</span> · ${TAGS[p.id].join(" · ")}</div></div></div>`}).join("")||'<p class="meta" style="padding:16px 0">No problems found.</p>';
  app.querySelectorAll(".pi").forEach(r=>r.onclick=()=>go("problem",+r.dataset.id))};
 $("#q").oninput=draw;$("#df").onchange=draw;draw();
}
function problem(id){
 const p=P.find(x=>x.id===id);app.classList.add("wide");
 const b0=best(id),all=subs.filter(s=>s.pid===id),acc=all.length?Math.round(all.filter(s=>s.score===100).length/all.length*100):0;
 const ex=(t,v)=>`<div class="exb"><b>${t}<button class="sec cp">Copy</button></b><pre>${esc(v)}</pre></div>`;
 app.innerHTML=`<div class="ph"><a id="bk" style="cursor:pointer;font-size:20px">←</a> ${p.t} <span class="meta">#${p.id}</span><span class="badge" id="bd">${Math.max(b0,0)} / 100</span></div>
 <div class="ws"><div class="pn"><div class="tabs"><a class="on" data-t="s">Statement</a><a data-t="a">Attempts</a></div><div class="pb" id="lp"></div></div>
 <div class="rt"><div class="pn edp"><div class="tool"><select id="lang" class="sel">${Object.entries(LANGS).map(([k,v])=>`<option value="${k}">${v}</option>`).join("")}</select><span><button class="sec" id="run">▶ Run</button> <button id="sub">Submit</button></span></div>
 <div class="ed"><pre class="ln" id="ln"></pre><textarea id="code" spellcheck="false" wrap="off"></textarea></div></div>
 <div class="pn btp"><div class="tabs"><a class="on" data-b="i">Input</a><a data-b="r">Run</a><a data-b="t">Tests</a></div><div class="pb" id="bp"></div></div></div></div>`;
 const stm=()=>{$("#lp").innerHTML=`<h1>${p.t}</h1><div class="mt"><span>⏱ 2 seconds</span><span>💾 128 MB</span><span class="d-${p.lvl}">${p.lvl}</span><span>🏷 ${TAGS[id].join(", ")}</span></div><p>${p.d}</p><h3>Input</h3><p>${p.i}</p><h3>Output</h3><p>${p.o}</p><h3>Examples</h3><div class="meta" style="margin-bottom:6px">Example 1</div><div class="ex">${ex("Input",p.ins[0])}${ex("Output",p.ref(p.ins[0]))}</div><p class="meta" style="margin-top:28px">${all.length} submissions · Acceptance rate ${acc}%</p>`;
  $("#lp").querySelectorAll(".cp").forEach((c,i)=>c.onclick=()=>{try{navigator.clipboard.writeText(i?p.ref(p.ins[0]):p.ins[0])}catch(e){}c.textContent="Copied"})};
 const att=()=>{const m=subs.filter(s=>s.user===me&&s.pid===id);$("#lp").innerHTML="<h3>Attempts</h3>"+(m.map(s=>`<p><span class="${s.verdict==="Accepted"?"ok":"bad"}">${s.verdict}</span> · ${s.score}% · ${LANGS[s.lang||"js"]} <span class="meta">${new Date(s.n).toLocaleString()}</span></p>`).join("")||'<p class="meta">No attempts yet.</p>')};
 document.querySelectorAll("[data-t]").forEach(a=>a.onclick=()=>{document.querySelectorAll("[data-t]").forEach(x=>x.classList.toggle("on",x===a));a.dataset.t==="s"?stm():att()});
 let inp=p.ins[0],outH="",tstH="";
 const bt=k=>{document.querySelectorAll("[data-b]").forEach(x=>x.classList.toggle("on",x.dataset.b===k));const bp=$("#bp");
  if(k==="i"){bp.innerHTML=`<div class="meta">Add your own test input below</div><textarea id="ci" spellcheck="false" style="min-height:90px;margin-top:8px"></textarea>`;$("#ci").value=inp;$("#ci").oninput=e=>inp=e.target.value}
  else bp.innerHTML=k==="r"?(outH||'<p class="meta">Press Run to execute your code on the input.</p>'):(tstH||'<p class="meta">Press Submit to test your solution.</p>')};
 document.querySelectorAll("[data-b]").forEach(a=>a.onclick=()=>bt(a.dataset.b));
 const ta=$("#code"),ls=$("#lang"),ln=$("#ln");ls.value=curLang;
 const nums=()=>{ln.textContent=ta.value.split("\n").map((_,i)=>i+1).join("\n")};
 const load=()=>{ta.value=drafts[id+ls.value]??TPL[ls.value];nums()};load();
 ls.onchange=()=>{curLang=ls.value;S.set("lang",curLang);load()};
 ta.oninput=()=>{drafts[id+ls.value]=ta.value;nums()};ta.onscroll=()=>{ln.scrollTop=ta.scrollTop};
 ta.onkeydown=e=>{if(e.key==="Tab"){e.preventDefault();ta.setRangeText("  ",ta.selectionStart,ta.selectionEnd,"end");ta.oninput()}};
 $("#bk").onclick=()=>go("problems");
 $("#run").onclick=async()=>{bt("r");$("#bp").innerHTML='<p class="meta">Running…</p>';const r=await runAny(ls.value,ta.value,inp);
  outH=r.tle?'<span class="warn">Time Limit Exceeded</span>':r.err?`<span class="warn">Runtime Error</span><pre>${esc(r.err)}</pre>`:`<div class="meta">Output</div><pre>${esc(r.out)}</pre>`;bt("r")};
 $("#sub").onclick=async()=>{const sb=$("#sub");sb.disabled=true;bt("t");$("#bp").innerHTML='<p class="meta">Judging…'+(ls.value==="js"?"":" (the first run loads the runtime, this can take a few seconds)")+'</p>';
  const r=await judge(p,ta.value,ls.value);
  subs.unshift({n:Date.now(),user:me,pid:id,verdict:r.verdict,score:r.score,res:r.res,lang:ls.value});subs=subs.slice(0,200);S.set("subs",subs);
  tstH=verdictHtml(r)+(r.msg?`<pre>${esc(r.msg)}</pre>`:"")+`<div class="tests">${r.res.map((x,i)=>`<span class="${x==="OK"?"p":"f"}" title="${x}">${i+1}</span>`).join("")}</div>`;
  bt("t");$("#bd").textContent=Math.max(best(id),0)+" / 100";sb.disabled=false};
 stm();bt("i");
}
function verdictHtml(r){const c=r.verdict==="Accepted"?"ok":r.verdict==="Wrong Answer"?"bad":"warn";
  return `<p><span class="${c}">${r.verdict}</span> — passed ${r.res.filter(x=>x==="OK").length} of ${r.res.length} tests (${r.score}%)</p>`}
const WSRC=`onmessage=e=>{const L=e.data.input.split("\\n");let i=0;const o=[];
const readline=()=>i<L.length?L[i++]:"",print=(...a)=>o.push(a.join(" "));
try{new Function("readline","print",e.data.code)(readline,print);postMessage({out:o.join("\\n")})}catch(x){postMessage({err:String(x)})}}`;
function runOne(code,input){
  return new Promise(res=>{
    let w;
    const direct=()=>{const L=input.split("\n");let i=0;const o=[];
      try{new Function("readline","print",code)(()=>i<L.length?L[i++]:"",(...a)=>o.push(a.join(" ")));res({out:o.join("\n")})}catch(x){res({err:String(x)})}};
    try{w=new Worker(URL.createObjectURL(new Blob([WSRC],{type:"text/javascript"})))}catch(e){return direct()}
    const t=setTimeout(()=>{w.terminate();res({tle:1})},2000);
    w.onmessage=e=>{clearTimeout(t);w.terminate();res(e.data)};
    w.onerror=()=>{clearTimeout(t);w.terminate();direct()};
    w.postMessage({code,input});
  });
}
async function judge(p,code,lang){
  const res=[];let verdict="Accepted",msg="";
  for(const inp of p.ins){
    const r=await runAny(lang,code,inp);if(r.err&&!msg)msg=/unsafe-eval|Content Security Policy/i.test(r.err)?"This page blocks running code (the claude.ai preview does this). Open the site from your GitHub Pages link or download index.html and open it in your browser.":r.err;let v="OK";
    if(r.tle)v="TLE";else if(r.err)v="RE";else if(r.out.trim().replace(/\s+\n/g,"\n")!==p.ref(inp))v="WA";
    res.push(v);
  }
  const ok=res.filter(x=>x==="OK").length,score=Math.round(ok/res.length*100);
  if(ok<res.length){const f=res.find(x=>x!=="OK");verdict=f==="TLE"?"Time Limit Exceeded":f==="RE"?"Runtime Error":"Wrong Answer"}
  return{verdict,score,res,msg};
}
function subsView(){
  const mine=subs.filter(s=>s.user===me);
  app.innerHTML=`<div class="card"><h2>My submissions</h2><div class="wrap"><table><tr><th>Time</th><th>Problem</th><th>Verdict</th><th>Score</th></tr>${
  mine.map(s=>`<tr><td>${new Date(s.n).toLocaleString()}</td><td>${s.pid}. ${P.find(p=>p.id===s.pid).t} <span class="meta">${LANGS[s.lang||"js"]}</span></td>
  <td class="${s.verdict==="Accepted"?"ok":s.verdict==="Wrong Answer"?"bad":"warn"}">${s.verdict}</td><td>${s.score}%</td></tr>`).join("")||'<tr><td colspan="4" class="meta">No submissions yet.</td></tr>'}</table></div></div>`;
}
function rating(){
  const us={};subs.forEach(s=>{us[s.user]=us[s.user]||{};us[s.user][s.pid]=Math.max(us[s.user][s.pid]||0,s.score)});
  const rows=Object.entries(us).map(([u,m])=>({u,solved:Object.values(m).filter(x=>x===100).length,pts:Object.values(m).reduce((a,b)=>a+b,0)}))
   .sort((a,b)=>b.solved-a.solved||b.pts-a.pts);
  app.innerHTML=`<div class="card"><h2>Rating</h2><div class="wrap"><table><tr><th>#</th><th>User</th><th>Solved</th><th>Points</th></tr>${
  rows.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.u)}</td><td>${r.solved}/${P.length}</td><td>${r.pts}</td></tr>`).join("")||'<tr><td colspan="4" class="meta">Nobody yet.</td></tr>'}</table></div>
  <p class="meta">Ranks users on this device. A shared server-side rating is the next step.</p></div>`;
}
function help(){
  app.innerHTML=`<div class="card"><h2>Help</h2><p>Choose <b>JavaScript, Python 3, C++ or C</b> above the editor. Read from standard input and write to standard output. In JavaScript use <code>readline()</code> and <code>print(...)</code>; in the other languages use the usual <code>input()</code>/<code>print()</code>, <code>cin</code>/<code>cout</code> or <code>scanf</code>/<code>printf</code>.</p><p class="meta">Python, C and C++ run inside your browser (Pyodide and JSCPP), so C and C++ support a common subset of the language.</p>
  <pre>const n = Number(readline());\nprint(n * 2);</pre>
  <p>Each problem has several tests. Your score is the percentage of tests passed, like on classic e-olymp. Each test has a 2 second limit.</p>
  <h3>Verdicts</h3><p><span class="ok">Accepted</span> — all tests passed · <span class="bad">Wrong Answer</span> · <span class="warn">Runtime Error</span> · <span class="warn">Time Limit Exceeded</span></p></div>`;
}
document.querySelectorAll("nav a").forEach(a=>a.onclick=()=>go(a.dataset.v));
const h=location.hash.match(/^#p(\d+)$/);
go(h&&P.find(p=>p.id==h[1])?"problem":(location.hash.slice(1)||"home"),h?+h[1]:undefined);
</script>
